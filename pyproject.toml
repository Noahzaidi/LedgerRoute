[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerroute"
version = "0.1.0"
description = "Auditable invoice classification and supplier resolution for finance workflows."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["invoices", "accounts-payable", "fastapi", "supplier-resolution", "llm"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "anthropic>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2.16",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Repository = "https://github.com/Noahzaidi/ledgerroute"
Issues = "https://github.com/Noahzaidi/ledgerroute/issues"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
